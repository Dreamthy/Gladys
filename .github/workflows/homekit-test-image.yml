name: Build HomeKit test image

# Builds a Docker image from any branch of this fork and pushes it to this
# repository's GitHub Container Registry. Meant for testing the HomeKit branches
# before they are opened as pull requests upstream, so it lives on master only
# and never pollutes the feature branches.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'feat/homekit-thermostat'
      platforms:
        description: 'Platforms to build (arm64 is emulated and slow)'
        required: true
        default: 'linux/amd64'

jobs:
  build-front:
    name: Front build
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: 💽 Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: 'front/package.json'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: 📦 Install NPM front packages
        working-directory: ./front
        run: npm ci
      - name: 🏗️ Build front
        working-directory: ./front
        run: npm run build
      - name: ↗️ Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static
          path: front/build

  docker:
    needs: build-front
    name: Build and push image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: 🏷️ Compute image name and tag
        id: names
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo '${{ github.event.inputs.branch }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: 💽 Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: ↙️ Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static
      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.buildx
          platforms: ${{ github.event.inputs.platforms }}
          push: true
          pull: true
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 📋 Summary
        run: |
          echo "Image: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
